map $uri $uri_redacted {
    default $uri;
    "~^(?<pre>.*/bot)[^/]+(?<post>/.*|$)$" "${pre}<redacted>${post}";
}

log_format redacted '$remote_addr - [$time_local] "$request_method $uri_redacted $server_protocol" $status $body_bytes_sent';

# nginx cannot natively redact error_log. Keep its level at warn or higher,
# and filter container logs before exporting them.
error_log /var/log/nginx/error.log warn;

server {
    listen 80;
    access_log /var/log/nginx/access.log redacted;

    location / {
        proxy_pass http://botapi:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
