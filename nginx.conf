# Preserve the original prefix before nginx normalizes dot segments.
map $request_uri $legacy_file_request {
    default 0;
    "~^/file(?:/|%2[fF]|%25|\?|$)" 1;
}

# Four 2 GiB uploads require at least 8 GiB of dedicated spool capacity.
map $server_port $upload_global_key { default uploads; }
limit_req_zone $binary_remote_addr zone=upload_rate:10m rate=2r/s;
limit_req_zone $upload_global_key zone=upload_global_rate:1m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=upload_client:10m;
limit_conn_zone $upload_global_key zone=upload_global:1m;
map "$server_port:$http_transfer_encoding" $reject_public_chunked {
    default 0;
    ~*^80:.+ 1;
}
map "$request_method:$http_content_length:$http_transfer_encoding" $reject_get_body {
    default 0;
    ~*^(GET|HEAD):0*[1-9][0-9]*: 1;
    ~*^(GET|HEAD):[^:]*:.+ 1;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    listen 82; # trusted internal listener, never expose to untrusted clients
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    client_body_temp_path /var/cache/nginx/client_temp;
    if ($reject_public_chunked) { return 411; }
    if ($reject_get_body) { return 400; }

    set $botapi_upstream http://botapi:8081;

    location = /health/live { return 404; }
    location = /health/ready { return 404; }
    location = /status { return 404; }
    location = /selfz { return 404; }

    if ($legacy_file_request) { return 404; }
    location = /file { return 404; }
    location /file/ { return 404; }

    location ~* ^/bot[^/]+/(?:sendPhoto|sendLivePhoto|sendAudio|sendDocument|sendVideo|sendAnimation|sendVoice|sendVideoNote|sendMediaGroup|sendSticker|uploadStickerFile|createNewStickerSet|addStickerToSet|setStickerSetThumbnail|setStickerSetThumb|setChatPhoto|setWebhook|editMessageMedia|sendPaidMedia|replaceStickerInSet|setCustomEmojiStickerSetThumbnail|setBusinessAccountProfilePhoto|setMyProfilePhoto|postStory|editStory)(?:/|$) {
        limit_except GET POST { deny all; }
        limit_req zone=upload_rate burst=4 nodelay;
        limit_req zone=upload_global_rate burst=20 nodelay;
        limit_req_status 429;
        limit_conn upload_client 2;
        limit_conn upload_global 4;
        limit_conn_status 429;
        client_max_body_size 2048m;
        client_body_timeout 300s;
        proxy_pass $botapi_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* ^/bot[^/]+/getUpdates$ {
        limit_except GET POST { deny all; }
        proxy_pass $botapi_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        limit_except GET POST { deny all; }
        proxy_pass $botapi_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        proxy_read_timeout 30s;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 81;
    access_log off;
    default_type application/json;
    set $observer_upstream http://botapi:8090;
    if ($args) { return 400; }
    if ($http_content_length) { return 400; }
    if ($http_transfer_encoding) { return 400; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host localhost;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 502 504 =503 @unavailable;

    location = /health/live {
        limit_except GET { deny all; }
        proxy_pass $observer_upstream$uri;
    }
    location = /health/ready {
        limit_except GET { deny all; }
        proxy_pass $observer_upstream$uri;
    }
    location = /status {
        limit_except GET { deny all; }
        proxy_pass $observer_upstream$uri;
    }
    location @unavailable { return 503 '{"error":"observer_unavailable"}'; }
    location / { return 404 '{"error":"not_found"}'; }
}
