# Preserve the original prefix before nginx normalizes dot segments.
map $request_uri $legacy_file_request {
    default 0;
    "~^/file(?:/|%2[fF]|%25|\?|$)" 1;
}

server {
    listen 80;

    if ($legacy_file_request) { return 404; }
    location = /file { return 404; }
    location /file/ { return 404; }

    location / {
        proxy_pass http://botapi:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
