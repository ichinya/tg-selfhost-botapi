name: Migration safety
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Explicit shell safety prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl openssl
          test "$(id -u)" -ne 0
      - name: Required POSIX unit and public-wrapper acceptance (no skips)
        run: |
          python3 tools/check_migration_checkout.py
          python3 tools/check_migration_safety.py --require-posix
          bash -n migrate_off_to_self.sh
          sh -n tools/fixtures/migration/fake-bot-api.sh
          node --test tools/test_migration_ui.mjs
          node tools/test_issue17_security_browser.cjs
  persistent-volumes:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: mock-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build current candidate without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: botapi-migration-candidate:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: BUILD_JOBS=2
      - name: Require lifecycle, permissions and bounded cleanup
        run: |
          chmod +x tools/fixtures/migration/fake-bot-api.sh
          python3 tools/check_migration_volumes.py --require-docker --image botapi-migration-candidate:check --receipt "$RUNNER_TEMP/migration-volume-gate.json"
