name: Doctor diagnostics
on:
  pull_request:
    paths:
      - 'tools/doctor*'
      - 'tools/observability/**'
      - 'tools/test_observability*.py'
      - 'tools/doctor_fixtures/**'
      - 'tools/test_doctor*.py'
      - 'tools/check_doctor.py'
      - 'tools/test_check_doctor.py'
      - '.github/workflows/doctor.yml'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'nginx-main.conf'
  push:
    branches: [main]
    paths:
      - 'tools/doctor*'
      - 'tools/observability/**'
      - 'tools/test_observability*.py'
      - 'tools/doctor_fixtures/**'
      - 'tools/test_doctor*.py'
      - 'tools/check_doctor.py'
      - 'tools/test_check_doctor.py'
      - '.github/workflows/doctor.yml'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'docker-compose*.yml'
      - 'nginx.conf'
      - 'nginx-main.conf'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Doctor unit suite (no daemon required)
        run: |
          python3 -m unittest discover -s tools -p 'test_doctor*.py' -v
          python3 -m unittest discover -s tools -p 'test_check_doctor.py' -v
          python3 -m unittest discover -s tools -p 'test_observability*.py' -v
          sh -n tools/doctor_fixtures/entrypoint.sh
      - name: Compose models
        env:
          API_ID: '12345'
          API_HASH: test-placeholder
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
  runtime:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Isolated synthetic runtime (no real bots)
        timeout-minutes: 12
        run: python3 tools/check_doctor.py
