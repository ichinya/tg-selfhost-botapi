name: Bot API image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:37 Asia/Yekaterinburg; Actions may delay scheduled runs.
    - cron: '37 23 * * *'

permissions:
  contents: read

concurrency:
  group: botapi-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install migration test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq
      - name: Test build input handling
        timeout-minutes: 11
        run: timeout 600 python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check Compose
        env:
          API_ID: '12345'
          API_HASH: test-placeholder
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable upstream inputs
        id: inputs
        run: python3 tools/image_inputs.py >> "$GITHUB_OUTPUT"
      - name: Check previously published build
        id: existing
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:build-$BUILD_FINGERPRINT" --format '{{json .Manifest}}' > registry-manifest.json 2>registry-error.txt; then
            digest="$(python3 -c 'import json,re; value=json.load(open("registry-manifest.json"))["digest"]; assert re.fullmatch("sha256:[0-9a-f]{64}", value); print(value)')"
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            # A missing/private package also fails inspection on the first build.
            # Never treat an unconfirmed registry response as a successful build.
            cat registry-error.txt >&2
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build candidate (patch must apply)
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: botapi-candidate:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BOT_API_REVISION=${{ steps.inputs.outputs.bot_api_revision }}
            ALPINE_IMAGE=${{ steps.inputs.outputs.alpine_image }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
            BUILD_JOBS=1
      - name: Load existing immutable candidate
        if: steps.existing.outputs.exists == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
          DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" botapi-candidate:check
      - name: Smoke-test built binary
        run: |
          docker run --rm --network none botapi-candidate:check --version
          docker run --rm --network none botapi-candidate:check --help
          docker run --rm --network none --entrypoint sh botapi-candidate:check -ec \
            'grep -aq "WebhookDelivery/1.0" /usr/local/bin/telegram-bot-api; sh -n /docker-entrypoint.sh'
      - name: Check selected source media semantics
        timeout-minutes: 10
        env:
          BOT_API_REVISION: ${{ steps.inputs.outputs.bot_api_revision }}
          ALPINE_IMAGE: ${{ steps.inputs.outputs.alpine_image }}
        run: |
          docker build --target source --build-arg BOT_API_REVISION="$BOT_API_REVISION" \
            --build-arg ALPINE_IMAGE="$ALPINE_IMAGE" --tag botapi-nonroot-source:check .
          sh -n tools/fixtures/nonroot/source-semantics.sh
          docker run --rm --read-only --network none --env BOT_API_REVISION \
            --mount "type=bind,source=$PWD/tools/fixtures/nonroot/source-semantics.sh,target=/check-source.sh,readonly" \
            --entrypoint sh botapi-nonroot-source:check /check-source.sh
      - name: Qualify non-root storage before publication
        timeout-minutes: 30
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
          BOT_API_REVISION: ${{ steps.inputs.outputs.bot_api_revision }}
        run: |
          candidate_id=$(docker image inspect --format '{{.Id}}' botapi-candidate:check)
          test "$(docker image inspect --format '{{index .Config.Labels "io.tg-selfhost.build-key"}}' "$candidate_id")" = "$BUILD_FINGERPRINT"
          test "$(docker image inspect --format '{{index .Config.Labels "io.tg-selfhost.bot-api-revision"}}' "$candidate_id")" = "$BOT_API_REVISION"
          sh -n tools/fixtures/nonroot/media-probe.sh
          sh -n tools/fixtures/migration/fake-bot-api.sh
          timeout 1400 python3 tools/check_nonroot.py --image "$candidate_id" --deadline 1200
          chmod +x tools/fixtures/migration/fake-bot-api.sh
          timeout 240 python3 tools/check_migration_volumes.py --require-docker --image "$candidate_id" --receipt "$RUNNER_TEMP/migration-volume-gate.json"
          printf '%s\n' "$candidate_id" > qualified-image-id.txt
      - name: Build downloads pair and qualify exact images
        env:
          PYTHON_IMAGE: ${{ steps.inputs.outputs.python_image }}
        run: |
          docker build -f Dockerfile.downloads --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" -t downloads-candidate:check .
          python3 tools/check_file_contract.py --botapi-image botapi-candidate:check \
            --downloads-image downloads-candidate:check --report "$RUNNER_TEMP/file-report.json"
      - name: Build Pages before promotion
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./.site-check
      - name: Check rendered docs and private exclusions
        run: python3 tools/check_docs.py .site-check
      - name: Publish tested build then promote latest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          REUSED_DIGEST: ${{ steps.existing.outputs.digest }}
          DOWNLOADS_FINGERPRINT: ${{ steps.inputs.outputs.downloads_key }}
        run: |
          tested_image_id="$(cat qualified-image-id.txt)"
          test "$(docker image inspect --format '{{.Id}}' botapi-candidate:check)" = "$tested_image_id"
          if [ "$EXISTS" != true ]; then
            docker tag "$tested_image_id" "$IMAGE:build-$BUILD_FINGERPRINT"
            docker push "$IMAGE:build-$BUILD_FINGERPRINT"
            docker buildx imagetools inspect "$IMAGE:build-$BUILD_FINGERPRINT" --format '{{json .Manifest}}' > published-manifest.json
            digest="$(python3 -c 'import json,re; value=json.load(open("published-manifest.json"))["digest"]; assert re.fullmatch("sha256:[0-9a-f]{64}", value); print(value)')"
          else
            digest="$REUSED_DIGEST"
          fi
          docker pull --platform linux/amd64 "$IMAGE@$digest"
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE@$digest")" = "$tested_image_id"
          # Both new and reused candidates passed this run's exact-pair gates.
          docker tag downloads-candidate:check "$IMAGE-downloads:build-$DOWNLOADS_FINGERPRINT"
          docker push "$IMAGE-downloads:build-$DOWNLOADS_FINGERPRINT"
          docker buildx imagetools create --tag "$IMAGE-downloads:latest" "$IMAGE-downloads:build-$DOWNLOADS_FINGERPRINT"
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$digest"
          echo "Published tested $IMAGE@$digest (build-$BUILD_FINGERPRINT)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-file-contract-receipt
          path: ${{ runner.temp }}/file-report.json
