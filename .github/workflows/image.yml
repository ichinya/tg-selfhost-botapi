name: Bot API image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:37 Asia/Yekaterinburg; Actions may delay scheduled runs.
    - cron: '37 23 * * *'

permissions:
  contents: read

concurrency:
  group: botapi-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/file-contract.yml
  image:
    needs: qualify
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.qualify.outputs.artifact_name }}
      - name: Load exact qualified pair
        env:
          BOTAPI_ID: ${{ needs.qualify.outputs.botapi_image_id }}
          DOWNLOADS_ID: ${{ needs.qualify.outputs.downloads_image_id }}
          BUILD_KEY: ${{ needs.qualify.outputs.build_key }}
          DOWNLOADS_KEY: ${{ needs.qualify.outputs.downloads_key }}
        run: |
          sha256sum --check candidate-pair.sha256
          gzip -dc candidate-pair.tar.gz | docker load
          python3 - <<'PY'
          import json, os, subprocess
          pair = json.load(open('candidate-pair.json'))
          assert pair['source_sha'] == os.environ['GITHUB_SHA']
          for name in ('unit', 'docs', 'runtime', 'tdlib_permissions'):
              assert pair[name] == 'PASS', name
          expected = dict(build_key='BUILD_KEY', downloads_key='DOWNLOADS_KEY', botapi_image_id='BOTAPI_ID', downloads_image_id='DOWNLOADS_ID')
          for key, env in expected.items(): assert pair[key] == os.environ[env]
          images = json.loads(subprocess.check_output(['docker', 'image', 'inspect', 'botapi-candidate:check', 'downloads-candidate:check']))
          assert images[0]['Id'] == pair['botapi_image_id']
          assert images[1]['Id'] == pair['downloads_image_id']
          PY
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish and promote qualified digests without rebuilding
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          BUILD_KEY: ${{ needs.qualify.outputs.build_key }}
          DOWNLOADS_KEY: ${{ needs.qualify.outputs.downloads_key }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag botapi-candidate:check "$image:build-$BUILD_KEY"
          docker tag downloads-candidate:check "$image-downloads:build-$DOWNLOADS_KEY"
          docker push "$image:build-$BUILD_KEY"
          docker push "$image-downloads:build-$DOWNLOADS_KEY"
          docker buildx imagetools inspect "$image:build-$BUILD_KEY" --format '{{json .Manifest}}' > botapi-manifest.json
          docker buildx imagetools inspect "$image-downloads:build-$DOWNLOADS_KEY" --format '{{json .Manifest}}' > downloads-manifest.json
          python3 - <<'PY'
          import json, os, re, subprocess
          pair = json.load(open('candidate-pair.json'))
          base = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          for name, image in [('botapi', base), ('downloads', base + '-downloads')]:
              digest = json.load(open(name + '-manifest.json'))['digest']
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', digest)
              ref = image + '@' + digest
              subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', ref], check=True)
              actual = json.loads(subprocess.check_output(['docker', 'image', 'inspect', ref]))[0]['Id']
              assert actual == pair[name + '_image_id']
              pair[name + '_digest'] = digest
          for name, image in [('botapi', base), ('downloads', base + '-downloads')]:
              subprocess.run(['docker', 'buildx', 'imagetools', 'create', '--tag', image + ':latest', image + '@' + pair[name + '_digest']], check=True)
          pair.update(publish='PASS', production='NOTRUN')
          with open('published-pair.json', 'w') as output: json.dump(pair, output, indent=2)
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          name: published-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: published-pair.json
          if-no-files-found: error
