name: Bot API image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:37 Asia/Yekaterinburg; Actions may delay scheduled runs.
    - cron: '37 23 * * *'

permissions:
  contents: read

concurrency:
  group: botapi-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install migration test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq
      - name: Test build input handling
        timeout-minutes: 11
        run: timeout 600 python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check Compose
        env:
          API_ID: '12345'
          API_HASH: test-placeholder
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable upstream inputs
        id: inputs
        run: python3 tools/image_inputs.py >> "$GITHUB_OUTPUT"
      - name: Check previously published build
        id: existing
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if docker buildx imagetools inspect "$image:build-$BUILD_FINGERPRINT" > /dev/null 2>registry-error.txt; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            # A missing/private package also fails inspection on the first build.
            # Never treat an unconfirmed registry response as a successful build.
            cat registry-error.txt >&2
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
          if docker buildx imagetools inspect "$image:observer-build-$BUILD_FINGERPRINT" >/dev/null 2>/dev/null; then
            echo 'observer_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'observer_exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check reviewed statistics source for candidate revision
        env:
          REVISION: ${{ steps.inputs.outputs.bot_api_revision }}
        run: |
          git init .stats-source
          git -C .stats-source remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C .stats-source fetch --depth 1 origin "$REVISION"
          git -C .stats-source checkout --detach FETCH_HEAD
          python3 tools/check_stats_source.py .stats-source
      - name: Build candidate (patch must apply)
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: botapi-candidate:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BOT_API_REVISION=${{ steps.inputs.outputs.bot_api_revision }}
            ALPINE_IMAGE=${{ steps.inputs.outputs.alpine_image }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
            BUILD_JOBS=2
      - name: Build observer candidate
        if: steps.existing.outputs.observer_exists != 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/observability/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: observer-candidate:check
          build-args: |
            OBSERVER_BASE=${{ steps.inputs.outputs.observer_base }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
      - name: Load reusable candidates and verify pair labels
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
          KEY: ${{ steps.inputs.outputs.build_key }}
          BOT_EXISTS: ${{ steps.existing.outputs.exists }}
          OBS_EXISTS: ${{ steps.existing.outputs.observer_exists }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$BOT_EXISTS" = true ]; then
            docker pull "$IMAGE:build-$KEY"
            docker tag "$IMAGE:build-$KEY" botapi-candidate:check
          fi
          if [ "$EVENT" != pull_request ] && [ "$OBS_EXISTS" = true ]; then
            docker pull "$IMAGE:observer-build-$KEY"
            docker tag "$IMAGE:observer-build-$KEY" observer-candidate:check
          fi
          for image in botapi-candidate:check observer-candidate:check; do
            test "$(docker image inspect --format '{{index .Config.Labels "io.tg-selfhost.build-key"}}' "$image")" = "$KEY"
          done
      - name: Smoke-test built binary
        run: |
          docker run --rm botapi-candidate:check --version
          docker run --rm --entrypoint sh botapi-candidate:check -ec \
            'grep -aq "WebhookDelivery/1.0" /usr/local/bin/telegram-bot-api; sh -n /docker-entrypoint.sh'
      - name: Qualify exact pair with mock and actual no-bot runtime
        timeout-minutes: 8
        run: python3 tools/check_observability.py --botapi-image botapi-candidate:check --observer-image observer-candidate:check
      - name: Publish tested build then promote latest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
          EXISTS: ${{ steps.existing.outputs.exists }}
          OBSERVER_EXISTS: ${{ steps.existing.outputs.observer_exists }}
        run: |
          if [ "$EXISTS" != true ]; then
            docker tag botapi-candidate:check "$IMAGE:build-$BUILD_FINGERPRINT"
            docker push "$IMAGE:build-$BUILD_FINGERPRINT"
          fi
          if [ "$OBSERVER_EXISTS" != true ]; then
            docker tag observer-candidate:check "$IMAGE:observer-build-$BUILD_FINGERPRINT"
            docker push "$IMAGE:observer-build-$BUILD_FINGERPRINT"
          fi
          # Existing immutable builds have already passed the same checks.
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:build-$BUILD_FINGERPRINT"
          docker buildx imagetools create --tag "$IMAGE:observer-latest" "$IMAGE:observer-build-$BUILD_FINGERPRINT"
          echo "Published $IMAGE:build-$BUILD_FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
