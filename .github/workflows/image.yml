name: Bot API image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:37 Asia/Yekaterinburg; Actions may delay scheduled runs.
    - cron: '37 23 * * *'

permissions:
  contents: read

concurrency:
  group: botapi-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v4
      - name: Test tracked checkout
        run: timeout 900 python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check monotonic apk policy
        run: python3 tools/apk_candidate.py policy
      - name: Resolve one build snapshot
        id: inputs
        run: |
          mkdir -p evidence
          python3 tools/image_inputs.py --json-out evidence/inputs.json --build-env-out .env.build >> "$GITHUB_OUTPUT"
      - name: Check Compose
        env:
          API_ID: '12345'
          API_HASH: test-placeholder
        run: |
          docker compose config --quiet
          docker compose --env-file .env.build -f docker-compose.yml -f docker-compose.build.yml config --quiet
          python3 -c 'import json; from pathlib import Path; i=json.loads(Path("evidence/inputs.json").read_text()); Path("evidence/gates.json").write_text(json.dumps({"build_key":i["build_key"],"unit":"PASS","compose":"PASS"}))'
      - name: Warm-cache apk regression
        run: python3 tools/check_apk_refresh.py --inputs evidence/inputs.json --output evidence/apk-refresh.json
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin existing build or select fresh candidate
        id: candidate
        run: python3 tools/apk_candidate.py prepare
      - name: Build candidate (patch must apply)
        if: steps.candidate.outputs.mode == 'build'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: botapi-candidate:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BOT_API_REVISION=${{ steps.inputs.outputs.bot_api_revision }}
            ALPINE_IMAGE=${{ steps.inputs.outputs.alpine_image }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
            APK_REFRESH_ID=${{ steps.inputs.outputs.apk_refresh_id }}
            APK_POLICY_VERSION=${{ steps.inputs.outputs.policy_version }}
            APK_REFRESH_WINDOW=${{ steps.inputs.outputs.apk_refresh_window }}
            APK_REFRESH_GENERATION=${{ steps.inputs.outputs.generation }}
            BUILD_JOBS=2
      - name: Check reviewed statistics source
        env:
          REVISION: ${{ steps.inputs.outputs.bot_api_revision }}
        run: |
          git init .stats-source
          git -C .stats-source remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C .stats-source fetch --depth 1 origin "$REVISION"
          git -C .stats-source checkout --detach FETCH_HEAD
          python3 tools/check_stats_source.py .stats-source
      - name: Build observer candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/observability/Dockerfile
          platforms: linux/amd64
          load: true
          tags: observer-candidate:check
          build-args: |
            OBSERVER_BASE=${{ steps.inputs.outputs.observer_base }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
      - name: Qualify observer and downloads against exact Bot API candidate
        env:
          PYTHON_IMAGE: ${{ steps.inputs.outputs.python_image }}
          KEY: ${{ steps.inputs.outputs.build_key }}
        run: |
          image=$(python3 -c 'import json; print(json.load(open("evidence/state.json"))["image"])')
          docker tag "$image" botapi-candidate:check
          for candidate in botapi-candidate:check observer-candidate:check; do
            test "$(docker image inspect --format '{{index .Config.Labels "io.tg-selfhost.build-key"}}' "$candidate")" = "$KEY"
          done
          python3 tools/check_observability.py --botapi-image botapi-candidate:check --observer-image observer-candidate:check
          docker build -f Dockerfile.downloads --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" -t downloads-candidate:check .
          python3 tools/check_file_contract.py --botapi-image botapi-candidate:check --downloads-image downloads-candidate:check --report evidence/file-report.json
      - name: Smoke-test built binary
        run: |
          docker run --rm botapi-candidate:check --version
          docker run --rm --entrypoint sh botapi-candidate:check -ec \
            'grep -aq "WebhookDelivery/1.0" /usr/local/bin/telegram-bot-api; sh -n /docker-entrypoint.sh'
      - name: Qualify exact native image before publish or promotion
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
        run: python3 tools/issue17_security_gate.py --image botapi-candidate:check --expected-build-key "$BUILD_FINGERPRINT" --manifest evidence/issue17-image.json
      - name: Build Pages before promotion
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./.site-check
      - name: Check rendered docs and private exclusions
        run: python3 tools/check_docs.py .site-check
      - name: Validate actual metadata and repeat smoke
        run: python3 tools/apk_candidate.py qualify
      - name: Save qualification before registry writes
        uses: actions/upload-artifact@v4
        with:
          name: apk-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Publish unique candidate and verify registry config
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: python3 tools/apk_candidate.py publish-candidate
      - name: Save digest receipt before promotion
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v4
        with:
          name: apk-digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Publish qualified observer and downloads
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          KEY: ${{ steps.inputs.outputs.build_key }}
          DOWNLOADS_KEY: ${{ steps.inputs.outputs.downloads_key }}
        run: |
          python3 -c 'import json; import sys; sys.path.insert(0, "tools"); from apk_candidate import assert_fresh; assert_fresh(json.load(open("evidence/inputs.json")))'
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag observer-candidate:check "$image:observer-build-$KEY"
          docker push "$image:observer-build-$KEY"
          docker tag downloads-candidate:check "$image-downloads:build-$DOWNLOADS_KEY"
          docker push "$image-downloads:build-$DOWNLOADS_KEY"
          docker buildx imagetools create --tag "$image:observer-latest" "$image:observer-build-$KEY"
          docker buildx imagetools create --tag "$image-downloads:latest" "$image-downloads:build-$DOWNLOADS_KEY"
      - name: Assign immutable build tag and promote verified digest
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: python3 tools/apk_candidate.py promote
      - name: Save results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
