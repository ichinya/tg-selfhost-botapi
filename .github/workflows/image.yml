name: Bot API image

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:37 Asia/Yekaterinburg; Actions may delay scheduled runs.
    - cron: '37 23 * * *'

permissions:
  contents: read

concurrency:
  group: botapi-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install migration test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bash curl jq
          command -v bash
          python3 --version
          node --version
          python3 -c 'import os, pty; master, slave = pty.openpty(); os.close(master); os.close(slave)'
      - name: Consume one saved snapshot for this run
        id: inputs
        env:
          DISCOVERY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          snapshot=image-inputs.lock.json
          if [ "$DISCOVERY" = true ]; then
            snapshot="$RUNNER_TEMP/discovered-inputs.json"
            python3 tools/image_inputs.py --save-discovery "$snapshot"
          fi
          python3 tools/image_inputs.py --inputs-file "$snapshot" --capture-wrapper "$RUNNER_TEMP/source-inputs.json"
          python3 tools/image_inputs.py --inputs-file "$RUNNER_TEMP/source-inputs.json" --json-file "$RUNNER_TEMP/resolved-inputs.json" --build-env .env.build >> "$GITHUB_OUTPUT"
          cat .env.build >> "$GITHUB_ENV"
      - name: Test build input handling
        timeout-minutes: 11
        run: timeout 600 python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check Compose
        env:
          API_ID: '12345'
          API_HASH: test-placeholder
        run: |
          docker compose --env-file .env.build config --quiet
          docker compose --env-file .env.build -f docker-compose.yml -f docker-compose.build.yml config --quiet
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check previously published build
        id: existing
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
          REPOSITORY: ${{ github.repository }}
          DOWNLOADS_KEY: ${{ steps.inputs.outputs.downloads_key }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          digest="$(python3 tools/check_release.py --lookup "$image:build-$BUILD_FINGERPRINT")"
          if [ "$digest" = NOT_FOUND ]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          fi
          observer_digest="$(python3 tools/check_release.py --lookup "$image-observer:build-$BUILD_FINGERPRINT")"
          if [ "$observer_digest" = NOT_FOUND ]; then
            echo 'observer_exists=false' >> "$GITHUB_OUTPUT"
          else
            echo 'observer_exists=true' >> "$GITHUB_OUTPUT"
            echo "observer_digest=$observer_digest" >> "$GITHUB_OUTPUT"
          fi
          sender_digest="$(python3 tools/check_release.py --lookup "$image-sender:build-$BUILD_FINGERPRINT")"
          if [ "$sender_digest" = NOT_FOUND ]; then
            echo 'sender_exists=false' >> "$GITHUB_OUTPUT"
            if [ "$digest" != NOT_FOUND ]; then
              echo 'Existing runtime lacks its retained test artifact; restore release evidence before reuse' >&2
              exit 1
            fi
          else
            echo 'sender_exists=true' >> "$GITHUB_OUTPUT"
            echo "sender_digest=$sender_digest" >> "$GITHUB_OUTPUT"
          fi
          downloads_digest="$(python3 tools/check_release.py --lookup "$image-downloads:build-$DOWNLOADS_KEY")"
          echo "downloads_digest=$downloads_digest" >> "$GITHUB_OUTPUT"
      - name: Check reviewed statistics source for candidate revision
        env:
          REVISION: ${{ steps.inputs.outputs.bot_api_revision }}
        run: |
          git init .stats-source
          git -C .stats-source remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C .stats-source fetch --depth 1 origin "$REVISION"
          git -C .stats-source checkout --detach FETCH_HEAD
          python3 tools/check_stats_source.py .stats-source
      - name: Build candidate (patch must apply)
        if: steps.existing.outputs.exists != 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: botapi-candidate:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BOT_API_REVISION=${{ steps.inputs.outputs.bot_api_revision }}
            ALPINE_IMAGE=${{ steps.inputs.outputs.alpine_image }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
            BUILD_JOBS=1
            BOT_API_VERSION=${{ steps.inputs.outputs.bot_api_version }}
            SUBMODULES=${{ steps.inputs.outputs.submodules_arg }}
            TDLIB_REVISION=${{ fromJSON(steps.inputs.outputs.submodules).td }}
            WRAPPER_REVISION=${{ steps.inputs.outputs.wrapper_revision }}
            APK_REFRESH_ID=${{ steps.inputs.outputs.apk_refresh_id }}
      - name: Load existing immutable candidate
        if: steps.existing.outputs.exists == 'true' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
          DIGEST: ${{ steps.existing.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" botapi-candidate:check
      - name: Build observer candidate
        if: steps.existing.outputs.observer_exists != 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tools/observability/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: observer-candidate:check
          build-args: |
            OBSERVER_BASE=${{ steps.inputs.outputs.observer_base }}
            APK_REFRESH_ID=${{ steps.inputs.outputs.apk_refresh_id }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
      - name: Load reusable candidates and verify pair labels
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
          KEY: ${{ steps.inputs.outputs.build_key }}
          OBS_DIGEST: ${{ steps.existing.outputs.observer_digest }}
          OBS_EXISTS: ${{ steps.existing.outputs.observer_exists }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$OBS_EXISTS" = true ]; then
            docker pull --platform linux/amd64 "$IMAGE-observer@$OBS_DIGEST"
            docker tag "$IMAGE-observer@$OBS_DIGEST" observer-candidate:check
          fi
          for image in botapi-candidate:check observer-candidate:check; do
            test "$(docker image inspect --format '{{index .Config.Labels "io.tg-selfhost.build-key"}}' "$image")" = "$KEY"
          done
      - name: Smoke-test built binary
        run: |
          docker run --rm --network none botapi-candidate:check --version
          docker run --rm --network none botapi-candidate:check --help
          docker run --rm --network none --entrypoint sh botapi-candidate:check -ec \
            'grep -aq "WebhookDelivery/1.0" /usr/local/bin/telegram-bot-api; sh -n /docker-entrypoint.sh'
      - name: Check selected source media semantics
        timeout-minutes: 10
        env:
          BOT_API_REVISION: ${{ steps.inputs.outputs.bot_api_revision }}
          ALPINE_IMAGE: ${{ steps.inputs.outputs.alpine_image }}
        run: |
          set -a; . ./.env.build; set +a
          docker build --target source --build-arg "BOT_API_REVISION=$BOT_API_REVISION" --build-arg "BOT_API_VERSION=$BOT_API_VERSION" --build-arg "ALPINE_IMAGE=$ALPINE_IMAGE" --build-arg "BUILD_FINGERPRINT=$BUILD_FINGERPRINT" --build-arg "BUILD_JOBS=$BUILD_JOBS" --build-arg "SUBMODULES=$SUBMODULES" --build-arg "TDLIB_REVISION=$TDLIB_REVISION" --build-arg "WRAPPER_REVISION=$WRAPPER_REVISION" --build-arg "APK_REFRESH_ID=$APK_REFRESH_ID" --tag botapi-nonroot-source:check .
          sh -n tools/fixtures/nonroot/source-semantics.sh
          docker run --rm --read-only --network none --env BOT_API_REVISION \
            --mount "type=bind,source=$PWD/tools/fixtures/nonroot/source-semantics.sh,target=/check-source.sh,readonly" \
            --entrypoint sh botapi-nonroot-source:check /check-source.sh
      - name: Qualify non-root storage before publication
        timeout-minutes: 30
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
          BOT_API_REVISION: ${{ steps.inputs.outputs.bot_api_revision }}
        run: |
          candidate_id=$(docker image inspect --format '{{.Id}}' botapi-candidate:check)
          test "$(docker image inspect --format '{{index .Config.Labels "io.tg-selfhost.build-key"}}' "$candidate_id")" = "$BUILD_FINGERPRINT"
          test "$(docker image inspect --format '{{index .Config.Labels "io.tg-selfhost.bot-api-revision"}}' "$candidate_id")" = "$BOT_API_REVISION"
          sh -n tools/fixtures/nonroot/media-probe.sh
          sh -n tools/fixtures/migration/fake-bot-api.sh
          timeout 1400 python3 tools/check_nonroot.py --image "$candidate_id" --deadline 1200
          chmod +x tools/fixtures/migration/fake-bot-api.sh
          timeout 240 python3 tools/check_migration_volumes.py --require-docker --image "$candidate_id" --receipt "$RUNNER_TEMP/migration-volume-gate.json"
          printf '%s\n' "$candidate_id" > qualified-image-id.txt
      - name: Qualify exact native image before publish or promotion
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.build_key }}
        run: python3 tools/issue17_security_gate.py --image botapi-candidate:check --expected-build-key "$BUILD_FINGERPRINT" --manifest "$RUNNER_TEMP/issue17-image.json"
      - name: Upload sanitized image qualification
        uses: actions/upload-artifact@v4
        with:
          name: issue17-image-manifest
          path: ${{ runner.temp }}/issue17-image.json

      - name: Qualify exact pair with mock and actual no-bot runtime
        timeout-minutes: 8
        run: python3 tools/check_observability.py --botapi-image botapi-candidate:check --observer-image observer-candidate:check --nginx-image "${{ steps.inputs.outputs.nginx_image }}"
      - name: Build downloads pair and qualify exact images
        env:
          PYTHON_IMAGE: ${{ steps.inputs.outputs.python_image }}
          DOWNLOADS_FINGERPRINT: ${{ steps.inputs.outputs.downloads_key }}
          FILE_NGINX_IMAGE: ${{ steps.inputs.outputs.nginx_image }}
        run: |
          digest="${{ steps.existing.outputs.downloads_digest }}"
          if [ "$digest" = NOT_FOUND ] || [ "${{ github.event_name }}" = pull_request ]; then
            docker build -f Dockerfile.downloads --build-arg "BUILD_FINGERPRINT=$DOWNLOADS_FINGERPRINT" --build-arg "PYTHON_IMAGE=$PYTHON_IMAGE" -t downloads-candidate:check .
          else
            docker pull --platform linux/amd64 "${{ steps.existing.outputs.image }}-downloads@$digest"
            docker tag "${{ steps.existing.outputs.image }}-downloads@$digest" downloads-candidate:check
          fi
          python3 tools/check_file_contract.py --botapi-image botapi-candidate:check \
            --downloads-image downloads-candidate:check --report "$RUNNER_TEMP/file-report.json"
      - name: Build test-only production sender target
        if: steps.existing.outputs.sender_exists != 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: qualification
          platforms: linux/amd64
          load: true
          push: false
          tags: sender-candidate:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BOT_API_REVISION=${{ steps.inputs.outputs.bot_api_revision }}
            BOT_API_VERSION=${{ steps.inputs.outputs.bot_api_version }}
            ALPINE_IMAGE=${{ steps.inputs.outputs.alpine_image }}
            BUILD_FINGERPRINT=${{ steps.inputs.outputs.build_key }}
            SUBMODULES=${{ steps.inputs.outputs.submodules_arg }}
            WRAPPER_REVISION=${{ steps.inputs.outputs.wrapper_revision }}
            APK_REFRESH_ID=${{ steps.inputs.outputs.apk_refresh_id }}
            TDLIB_REVISION=${{ fromJSON(steps.inputs.outputs.submodules).td }}
            BUILD_JOBS=1
      - name: Reuse the retained test-only sender artifact by digest
        if: steps.existing.outputs.sender_exists == 'true' && github.event_name != 'pull_request'
        run: |
          ref="${{ steps.existing.outputs.image }}-sender@${{ steps.existing.outputs.sender_digest }}"
          docker pull --platform linux/amd64 "$ref"
          docker tag "$ref" sender-candidate:check
      - name: Fail-closed bundle qualification (fresh and reused)
        timeout-minutes: 60
        env:
          FILE_NGINX_IMAGE: ${{ steps.inputs.outputs.nginx_image }}
        run: |
          python3 tools/qualify_release.py qualify --inputs "$RUNNER_TEMP/resolved-inputs.json" --directory "$RUNNER_TEMP/issue12-qualification"
      - name: Build Pages before promotion
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./.site-check
      - name: Check rendered docs and private exclusions
        run: python3 tools/check_docs.py .site-check
      - name: Publish qualified immutable bundle without rebuild
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          IMAGE: ${{ steps.existing.outputs.image }}
        run: |
          python3 tools/qualify_release.py publish --inputs "$RUNNER_TEMP/resolved-inputs.json" --directory "$RUNNER_TEMP/issue12-qualification" --repository "$IMAGE"
          echo 'Immutable bundle published. Deployment selection requires the complete archived receipt; no VPS was changed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Archive bundle evidence and exact inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue12-bundle-evidence
          path: |
            ${{ runner.temp }}/issue12-qualification
            ${{ runner.temp }}/resolved-inputs.json
            ${{ runner.temp }}/source-inputs.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-file-contract-receipt
          path: ${{ runner.temp }}/file-report.json
