name: Documentation

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'index.md'
      - '_config.yml'
      - '_layouts/**'
      - 'assets/**'
      - 'docs/**'
      - 'tg_selfhost_botapi_migrator.html'
      - 'tools/check_docs.py'
      - 'tools/test_check_docs.py'
      - 'examples/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - 'tools/test_docs_privacy.py'
      - 'tools/test_issue11_docs.py'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '_config.yml'
      - '_layouts/**'
      - 'assets/**'
      - 'tg_selfhost_botapi_migrator.html'
      - 'tools/check_docs.py'
      - 'tools/test_check_docs.py'
      - 'examples/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.env.example'
      - 'docker-entrypoint.sh'
      - 'nginx.conf'
      - 'tools/test_docs_privacy.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Create synthetic private-storage sentinel
        run: |
          mkdir -p logs/migration
          printf 'synthetic publication exclusion check\n' > logs/migration/issue11-sentinel.txt
      - name: Build the GitHub Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./.site-check
      - name: Check rendered links and the original migrator URL
        timeout-minutes: 2
        run: |
          test ! -e .site-check/logs/migration/issue11-sentinel.txt
          test ! -e .site-check/logs
          timeout 60 python3 tools/check_docs.py .site-check
          timeout 30 python3 -m unittest discover -s tools -p 'test_issue11_docs.py' -v
