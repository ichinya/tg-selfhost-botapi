services:
  botapi:
    image: ${DOCTOR_FIXTURE_IMAGE:?harness must select its own image}
    build:
      context: .
      args:
        PYTHON_IMAGE: ${DOCTOR_PYTHON_IMAGE:?harness must pin the base digest}
    environment:
      TELEGRAM_API_ID: '12345'
      TELEGRAM_API_HASH: synthetic-doctor-credential
      TELEGRAM_LOCAL: 'true'
    volumes:
      - state:/var/lib/telegram-bot-api
      - audit:/audit
  gateway:
    image: ${DOCTOR_NGINX_IMAGE:?harness must pin the gateway digest}
    ports:
      - '127.0.0.1::80'
      - '127.0.0.1::81'
    volumes:
      - ../../nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../nginx.observability.conf:/etc/nginx/conf.d/observability.conf:ro
      - gateway_client_temp:/var/cache/nginx/client_temp
    depends_on:
      botapi:
        condition: service_healthy
      observer:
        condition: service_started
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 1s
      timeout: 2s
      retries: 20
  observer:
    image: ${DOCTOR_OBSERVER_IMAGE:?harness must select its own observer image}
    build:
      context: ../..
      dockerfile: tools/observability/Dockerfile
      args:
        APK_REFRESH_ID: ${DOCTOR_APK_REFRESH_ID:?harness must select a synthetic refresh ID}
        BUILD_FINGERPRINT: ${DOCTOR_BUILD_FINGERPRINT:?harness must select a synthetic fingerprint}
    network_mode: service:botapi
    user: '101:101'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TELEGRAM_STAT: 'false'
    depends_on:
      botapi:
        condition: service_healthy
volumes:
  state:
  audit:
  gateway_client_temp:
