user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/null;

events { worker_connections 1024; }

http {
    error_log /dev/null;
    map $request_method $privacy_method {
        default OTHER;
        GET GET;
        POST POST;
        HEAD HEAD;
        OPTIONS OPTIONS;
    }
    map $uri $privacy_route {
        default other;
        ~^/bot[^/]+/ api;
        ~^/file/bot[^/]+/ file;
    }
    log_format privacy '$privacy_method $privacy_route $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log privacy;
    # Preserve the original prefix before nginx normalizes dot segments.
map $request_uri $legacy_file_request {
    default 0;
    "~^/file(?:/|%2[fF]|%25|\?|$)" 1;
}

resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    set $botapi_upstream http://botapi:8081;

    location = /health/live { return 404; }
    location = /health/ready { return 404; }
    location = /status { return 404; }
    location = /selfz { return 404; }

    if ($legacy_file_request) { return 404; }
    location = /file { return 404; }
    location /file/ { return 404; }

    location / {
        proxy_pass $botapi_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 81;
    access_log off;
    default_type application/json;
    set $observer_upstream http://botapi:8090;
    if ($args) { return 400; }
    if ($http_content_length) { return 400; }
    if ($http_transfer_encoding) { return 400; }
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Host localhost;
    proxy_connect_timeout 1s;
    proxy_read_timeout 3s;
    proxy_intercept_errors on;
    error_page 502 504 =503 @unavailable;

    location = /health/live {
        limit_except GET { deny all; }
        proxy_pass $observer_upstream$uri;
    }
    location = /health/ready {
        limit_except GET { deny all; }
        proxy_pass $observer_upstream$uri;
    }
    location = /status {
        limit_except GET { deny all; }
        proxy_pass $observer_upstream$uri;
    }
    location @unavailable { return 503 '{"error":"observer_unavailable"}'; }
    location / { return 404 '{"error":"not_found"}'; }
}

}
