services:
  botapi:
    build:
      context: .
    volumes:
      - state:/private-state
      - temp:/private-temp
      - secret:/private-secret
  gateway:
    image: ${FILE_NGINX_IMAGE:?Pinned fixture nginx image required}
    volumes:
      - ${FIXTURE_NGINX_MAIN}:/etc/nginx/nginx.conf:ro
      - ${FIXTURE_NGINX}:/etc/nginx/conf.d/default.conf:ro
      - gateway_client_temp:/var/cache/nginx/client_temp
    depends_on:
      - botapi
volumes:
  gateway_client_temp:
  state:
  temp:
  secret:
