services:
  botapi:
    environment:
      # Explicit empty scalars reliably override inline values in long overlay chains.
      TELEGRAM_API_ID: ""
      TELEGRAM_API_HASH: ""
      TELEGRAM_API_ID_FILE: /run/secrets/telegram_api_id
      TELEGRAM_API_HASH_FILE: /run/secrets/telegram_api_hash
    secrets:
      - telegram_api_id
      - telegram_api_hash
    ulimits:
      core: 0

secrets:
  telegram_api_id:
    file: ${TELEGRAM_API_ID_SECRET_PATH:?Set TELEGRAM_API_ID_SECRET_PATH}
  telegram_api_hash:
    file: ${TELEGRAM_API_HASH_SECRET_PATH:?Set TELEGRAM_API_HASH_SECRET_PATH}
