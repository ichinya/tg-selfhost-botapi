services:
  downloads:
    image: tg-selfhost-botapi-downloads:local
    build:
      context: .
      dockerfile: Dockerfile.downloads
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim@sha256:4840d514c583a4d3d8cad3940e68dee6f0f6f3635c12fcd0a3d74c21a5b93a54}
        BUILD_FINGERPRINT: ${DOWNLOADS_FINGERPRINT:-local-unqualified}
        WRAPPER_REVISION: ${WRAPPER_REVISION:-unqualified}
