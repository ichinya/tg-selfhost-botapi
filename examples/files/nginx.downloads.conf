# Host nginx TLS frontend; install certificate and private key separately.
# This frontend needs neither media nor Bot API credentials.
server {
    listen 443 ssl;
    server_name downloads.example.com;
    ssl_certificate /etc/nginx/tls/downloads.crt;
    ssl_certificate_key /etc/nginx/tls/downloads.key;
    access_log off;
    error_log /var/log/nginx/downloads-error.log crit;
    client_max_body_size 4k;
    client_body_buffer_size 8k;
    client_body_timeout 30s;
    location = /v1/files/download {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 610s;
        proxy_send_timeout 30s;
    }
    location / { return 404; }
}
