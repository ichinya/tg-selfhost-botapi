services:
  observer:
    image: tg-selfhost-botapi-observer:local
    build:
      context: .
      dockerfile: tools/observability/Dockerfile
      args:
        BUILD_FINGERPRINT: ${BUILD_FINGERPRINT:-local-unqualified}
        WRAPPER_REVISION: ${WRAPPER_REVISION:-unqualified}
        APK_REFRESH_ID: ${APK_REFRESH_ID:?Generate build.env using tools/image_inputs.py --build-env}
        OBSERVER_BASE: ${OBSERVER_BASE:-alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f}
