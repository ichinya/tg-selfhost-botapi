# Opt-in: docker compose -f docker-compose.yml -f docker-compose.downloads.yml ...
# Add one read-only bind per configured bot. Never mount the parent media or state.
services:
  downloads:
    image: ${DOWNLOADS_IMAGE:?Set a qualified immutable downloads image}
    user: "10001:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped
    depends_on: [botapi]
    volumes:
      - type: bind
        source: ${DOWNLOADS_CONFIG_FILE:?Set the absolute private registry path}
        target: /run/secrets/downloads.config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BOT_A_HOST_ROOT:?Set the existing bot-specific host directory}
        target: ${BOT_A_ROOT:?Set the exact absolute getFile bot root}
        read_only: true
        bind:
          create_host_path: false
  downloads-gateway:
    image: nginx:alpine
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cpus: 0.5
    mem_limit: 64m
    pids_limit: 32
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    ports:
      - "127.0.0.1:18082:80"
    volumes:
      - type: bind
        source: ./examples/files/nginx.downloads.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
    depends_on: [downloads]
