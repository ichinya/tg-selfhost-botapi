user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/null;

events { worker_connections 1024; }

http {
    error_log /dev/null;
    map $request_method $privacy_method {
        default OTHER;
        GET GET;
        POST POST;
        HEAD HEAD;
        OPTIONS OPTIONS;
    }
    map $uri $privacy_route {
        default other;
        ~^/bot[^/]+/ api;
        ~^/file/bot[^/]+/ file;
    }
    log_format privacy '$privacy_method $privacy_route $status $body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log privacy;
    include /etc/nginx/conf.d/*.conf;
}
