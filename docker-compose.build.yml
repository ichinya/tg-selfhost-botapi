# Generate .env.build using tools/image_inputs.py before local compilation.
services:
  botapi:
    image: tg-selfhost-botapi:local
    platform: ${BUILD_PLATFORM:-linux/amd64}
    build:
      context: .
      args:
        BOT_API_REVISION: ${BOT_API_REVISION:-}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-}
        BUILD_FINGERPRINT: ${BUILD_FINGERPRINT:-}
        APK_REFRESH_ID: ${APK_REFRESH_ID:-}
        APK_POLICY_VERSION: ${APK_POLICY_VERSION:-}
        APK_REFRESH_WINDOW: ${APK_REFRESH_WINDOW:-}
        APK_REFRESH_GENERATION: ${APK_REFRESH_GENERATION:-}
