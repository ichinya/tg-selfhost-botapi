# Local build: generate .env.build with tools/image_inputs.py first.
services:
  botapi:
    platform: linux/amd64
    image: tg-selfhost-botapi:local
    build:
      context: .
      args:
        BOT_API_REVISION: ${BOT_API_REVISION:?Generate .env.build from the saved snapshot}
        BOT_API_VERSION: ${BOT_API_VERSION:?Generate .env.build from the saved snapshot}
        ALPINE_IMAGE: ${ALPINE_IMAGE:?Generate .env.build from the saved snapshot}
        APK_REFRESH_ID: ${APK_REFRESH_ID:?Generate .env.build from the saved snapshot}
        SUBMODULES: ${SUBMODULES:?Generate .env.build from the saved snapshot}
        TDLIB_REVISION: ${TDLIB_REVISION:?Generate .env.build from the saved snapshot}
        WRAPPER_REVISION: ${WRAPPER_REVISION:?Generate .env.build from the saved snapshot}
        BUILD_FINGERPRINT: ${BUILD_FINGERPRINT:?Generate .env.build from the saved snapshot}
        BUILD_JOBS: ${BUILD_JOBS:?Generate .env.build from the saved snapshot}
