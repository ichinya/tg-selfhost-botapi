# Opt-in only: docker compose -f docker-compose.yml -f docker-compose.files.yml ...
services:
  botapi:
    environment:
      TELEGRAM_FILES_DIR: /var/lib/telegram-bot-api-files
      TELEGRAM_LOG_FILE: /var/lib/telegram-bot-api/botapi.log
      BOTAPI_MEDIA_REQUIRE_NONROOT: "1"
      BOTAPI_MEDIA_EXPECTED_GID: ${BOTAPI_GID:?Set BOTAPI_GID}
      BOTAPI_MEDIA_EXPECTED_UID: ${BOTAPI_UID:?Set BOTAPI_UID}
    volumes:
      - type: bind
        source: ${BOTAPI_MEDIA_SOURCE:?Set BOTAPI_MEDIA_SOURCE}
        target: /var/lib/telegram-bot-api-files
        bind:
          create_host_path: false
