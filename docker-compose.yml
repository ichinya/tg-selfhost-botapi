services:
  botapi:
    image: ${BOTAPI_IMAGE:-ghcr.io/ichinya/tg-selfhost-botapi:latest}
    container_name: tg_botapi
    restart: always
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_STAT: "false"
      TELEGRAM_HTTP_IP_ADDRESS: ${TELEGRAM_HTTP_IP_ADDRESS:-0.0.0.0}
      TELEGRAM_HTTP_PORT: ${TELEGRAM_HTTP_PORT:-8081}
    volumes:
      - ./data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "/usr/local/bin/botapi-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 3

  gateway:
    image: nginx:alpine
    container_name: tg_gateway
    restart: always
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:18080:80"
      # Port 82 is deliberately not published: chunked uploads require a trusted ingress.
    volumes:
      - ./nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - gateway_client_temp:/var/cache/nginx/client_temp
    depends_on:
      - botapi

volumes:
  gateway_client_temp:
