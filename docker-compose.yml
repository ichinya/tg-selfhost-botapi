services:
  botapi:
    image: ${BOTAPI_IMAGE:-ghcr.io/ichinya/tg-selfhost-botapi:latest}
    container_name: tg_botapi
    restart: always
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: "true"
      TELEGRAM_STAT: ${TELEGRAM_STAT:-false}
      TELEGRAM_HTTP_IP_ADDRESS: ${TELEGRAM_HTTP_IP_ADDRESS:-0.0.0.0}
      TELEGRAM_HTTP_PORT: ${TELEGRAM_HTTP_PORT:-8081}
    volumes:
      - ./data:/var/lib/telegram-bot-api
    healthcheck:
      test: ["CMD", "/usr/local/bin/botapi-healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 3

  observer:
    image: ${OBSERVER_IMAGE:-ghcr.io/ichinya/tg-selfhost-botapi:observer-latest}
    restart: always
    network_mode: service:botapi
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    environment:
      TELEGRAM_STAT: ${TELEGRAM_STAT:-false}
      TELEGRAM_HTTP_IP_ADDRESS: ${TELEGRAM_HTTP_IP_ADDRESS:-0.0.0.0}
      TELEGRAM_HTTP_PORT: ${TELEGRAM_HTTP_PORT:-8081}
      OBSERVER_RUNTIME_DIR: /inputs/runtime
      OBSERVER_MIGRATION_DIR: ${OBSERVER_MIGRATION_DIR:-}
      OBSERVER_REGISTRY: ${OBSERVER_REGISTRY:-}
      OBSERVER_CREDENTIALS_DIR: /inputs/credentials
    volumes:
      - ./.observability/runtime:/inputs/runtime:ro
      - ./.observability/migration:/inputs/migration:ro
      - ./.observability/registry:/inputs/registry:ro
      - ./.observability/credentials:/inputs/credentials:ro
    depends_on:
      botapi:
        condition: service_started
    healthcheck:
      test: ["CMD", "python3", "-m", "observability.server", "--selfcheck"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 3

  gateway:
    image: nginx:alpine
    container_name: tg_gateway
    restart: always
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:18080:80"
      - "${MGMT_BIND:-127.0.0.1}:18081:81"
      # Port 82 is deliberately not published: chunked uploads require a trusted ingress.
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - gateway_client_temp:/var/cache/nginx/client_temp
    depends_on:
      - botapi
      - observer

volumes:
  gateway_client_temp:
