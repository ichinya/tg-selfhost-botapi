services:
  botapi:
    image: aiogram/telegram-bot-api:latest
    container_name: tg_botapi
    restart: always
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - ./data:/var/lib/telegram-bot-api

  gateway:
    image: nginx:alpine
    container_name: tg_gateway
    restart: always
    ports:
      - "18080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data:/var/lib/telegram-bot-api:ro
    depends_on:
      - botapi